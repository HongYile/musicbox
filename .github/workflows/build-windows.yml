name: Build Windows

# Windows 版打包：Flutter 不支持跨系统编译，Windows 包在 windows-latest 上构建。
# 用法：推送 tag（如 v0.1.0）或在 Actions 页手动 Run workflow，产物为 zip 便携包。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    # 固定 windows-2022：windows-latest 已换装 VS18（MSVC 14.51），
    # 对老插件的实验性协程头直接报错；钉住镜像保证构建可复现。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze
        continue-on-error: true

      - run: flutter test

      - run: flutter build windows --release

      # 打包成便携 zip（含 exe 与全部 dll/资源）
      # 顺手并入 VC++ CRT 运行库，全新系统也免装环境、解压即用
      - name: Zip portable
        shell: pwsh
        run: |
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($crt) {
            Copy-Item "$($crt.FullName)\*.dll" build\windows\x64\runner\Release\
          }
          # 顶层套 Unison 文件夹：解压出来是一个目录，而不是散落一堆文件
          Copy-Item -Recurse build\windows\x64\runner\Release Unison
          Compress-Archive -Path Unison -DestinationPath unison-windows-x64.zip
          Remove-Item -Recurse Unison

      - uses: actions/upload-artifact@v4
        with:
          name: unison-windows-x64
          path: unison-windows-x64.zip

      # tag 触发时，顺手把 zip 挂到同名 Release 上
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: unison-windows-x64.zip
